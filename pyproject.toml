[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonunitarity-limits"
version = "0.1.2"
description = "Reproducible limits and projections for leptonic non-unitarity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
digitize = ["PyMuPDF>=1.23"]

[project.scripts]
nonunitarity-plot = "nonunitarity_limits.cli:main"
nonunitarity-bounds-plot = "nonunitarity_limits.plot_bounds:main"
nonunitarity-rates-plot = "nonunitarity_limits.plot_rates:main"
nonunitarity-mass-plot = "nonunitarity_limits.plot_mass_dependent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
